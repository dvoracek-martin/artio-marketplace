# Example TLS ingress for a host where deployment/compose.yaml binds only to loopback.
# Replace certificates and hostnames; do not expose the Compose ports directly.
server {
    listen 443 ssl;
    http2 on;
    server_name marketplace.example.com;

    ssl_certificate /etc/letsencrypt/live/marketplace.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketplace.example.com/privkey.pem;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:8080;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name registry.example.com;

    ssl_certificate /etc/letsencrypt/live/registry.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/registry.example.com/privkey.pem;

    # Docker clients treat a 401 on the registry ping as a global login
    # requirement, so public digest-pinned pulls would fail without credentials.
    location = /v2/ {
        add_header Docker-Distribution-API-Version "registry/2.0" always;
        return 200;
    }

    location / {
        client_max_body_size 0;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:5000;
    }
}

# Keep this publisher-only host separate so Docker login receives Zot's normal
# Basic-auth challenge. Replace the documentation subnet with trusted operator
# egress ranges; never expose this listener to arbitrary Internet clients.
server {
    listen 443 ssl;
    http2 on;
    server_name registry-push.example.com;

    ssl_certificate /etc/letsencrypt/live/registry-push.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/registry-push.example.com/privkey.pem;

    allow 203.0.113.0/24;
    deny all;

    location / {
        client_max_body_size 0;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:5001;
    }
}
