services:
  marketplace:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: artio-marketplace:local
    restart: unless-stopped
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001
    ports:
      - "127.0.0.1:${MARKETPLACE_API_PORT:-8080}:8080"
      - "127.0.0.1:${MARKETPLACE_MANAGEMENT_PORT:-8081}:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/artio_marketplace
      SPRING_DATASOURCE_USERNAME: artio_marketplace
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      MARKETPLACE_PUBLISHER_TOKEN_SHA256: ${MARKETPLACE_PUBLISHER_TOKEN_SHA256:?Set a SHA-256 hash in .env}
      MARKETPLACE_ADMIN_TOKEN_SHA256: ${MARKETPLACE_ADMIN_TOKEN_SHA256:?Set a SHA-256 hash in .env}
      MARKETPLACE_REVOCATION_TOKEN_SHA256: ${MARKETPLACE_REVOCATION_TOKEN_SHA256:?Set a SHA-256 hash in .env}
      MARKETPLACE_PUBLIC_RATE_LIMIT_PER_MINUTE: ${MARKETPLACE_PUBLIC_RATE_LIMIT_PER_MINUTE:-120}
      MARKETPLACE_PUBLISHER_RATE_LIMIT_PER_MINUTE: ${MARKETPLACE_PUBLISHER_RATE_LIMIT_PER_MINUTE:-30}
      MARKETPLACE_PUBLIC_GLOBAL_RATE_LIMIT_PER_MINUTE: ${MARKETPLACE_PUBLIC_GLOBAL_RATE_LIMIT_PER_MINUTE:-200000}
      MARKETPLACE_PUBLISHER_GLOBAL_RATE_LIMIT_PER_MINUTE: ${MARKETPLACE_PUBLISHER_GLOBAL_RATE_LIMIT_PER_MINUTE:-5000}
      MARKETPLACE_RATE_LIMIT_TRUSTED_PROXIES: ${MARKETPLACE_RATE_LIMIT_TRUSTED_PROXIES:-}
      MARKETPLACE_REGISTRY_HOST: ${MARKETPLACE_REGISTRY_HOST:-localhost:5000}
      MARKETPLACE_ZOT_URL: http://127.0.0.1:5000
      MARKETPLACE_ZOT_BINARY: /usr/local/bin/zot
      MARKETPLACE_ZOT_CONFIG: /etc/zot/config.json
      MARKETPLACE_MEDIA_ROOT: /var/lib/artio-marketplace/assets
    volumes:
      - zot_data:/var/lib/zot
      - catalog_assets:/var/lib/artio-marketplace/assets
      - type: bind
        source: ${ZOT_HTPASSWD_FILE:?Set ZOT_HTPASSWD_FILE to a protected htpasswd file}
        target: /run/secrets/zot_htpasswd
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/readiness HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 4s
      start_period: 45s
      retries: 3
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    mem_limit: 2g
    cpus: 2

  registry-gateway:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    restart: unless-stopped
    user: "101:101"
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "127.0.0.1:${MARKETPLACE_REGISTRY_PORT:-5000}:5000"
      - "127.0.0.1:${MARKETPLACE_REGISTRY_PUBLISH_PORT:-5001}:5001"
    volumes:
      - ./registry-gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=16m,uid=101,gid=101
      - /var/run:rw,noexec,nosuid,size=1m,uid=101,gid=101
    depends_on:
      marketplace:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/v2/"]
      interval: 15s
      timeout: 3s
      retries: 3
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    mem_limit: 128m
    cpus: 0.5

  postgres:
    image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_DB: artio_marketplace
      POSTGRES_USER: artio_marketplace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artio_marketplace -d artio_marketplace"]
      interval: 5s
      timeout: 3s
      retries: 15
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 2

volumes:
  postgres_data:
  zot_data:
  catalog_assets:
