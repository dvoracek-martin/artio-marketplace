server {
    listen 5000;
    server_name _;

    # Docker treats a 401 on this ping as a requirement to have credentials
    # even when the requested repository permits anonymous reads. Keep the
    # ping public; Zot still enforces anonymous read-only and publisher writes.
    location = /v2/ {
        add_header Docker-Distribution-API-Version "registry/2.0" always;
        return 200;
    }

    location / {
        client_max_body_size 0;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://marketplace:5000;
    }
}

# Docker's login/push endpoint must keep Zot's Basic challenge so the Docker
# client stores and sends publisher credentials. Public Core pull references
# never contain this host/port; both listeners address the same Zot storage.
server {
    listen 5001;
    server_name _;

    location / {
        client_max_body_size 0;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://marketplace:5000;
    }
}
