server:
  address: 0.0.0.0
  port: 8080
  shutdown: graceful
  max-http-request-header-size: 16KB
  tomcat:
    connection-timeout: 5s
    keep-alive-timeout: 15s
    max-keep-alive-requests: 100
    max-swallow-size: 1MB
    max-http-form-post-size: 6MB
spring:
  application:
    name: artio-marketplace
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/artio_marketplace}
    username: ${SPRING_DATASOURCE_USERNAME:artio_marketplace}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me-local-only}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
      file-size-threshold: 0
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
  jackson2:
    deserialization:
      fail-on-unknown-properties: true
  http:
    converters:
      preferred-json-mapper: jackson2
management:
  server:
    port: 8081
    address: 0.0.0.0
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    readinessstate:
      enabled: true
    probes:
      enabled: true
    group:
      readiness:
        include: readinessState,db,zot
marketplace:
  rate-limit:
    public-per-minute: ${MARKETPLACE_PUBLIC_RATE_LIMIT_PER_MINUTE:120}
    publisher-per-minute: ${MARKETPLACE_PUBLISHER_RATE_LIMIT_PER_MINUTE:30}
    public-global-per-minute: ${MARKETPLACE_PUBLIC_GLOBAL_RATE_LIMIT_PER_MINUTE:200000}
    publisher-global-per-minute: ${MARKETPLACE_PUBLISHER_GLOBAL_RATE_LIMIT_PER_MINUTE:5000}
    trusted-proxies: ${MARKETPLACE_RATE_LIMIT_TRUSTED_PROXIES:}
  registry:
    public-host: ${MARKETPLACE_REGISTRY_HOST:localhost:5000}
    allowed-repository-prefixes: ${MARKETPLACE_REGISTRY_ALLOWED_REPOSITORY_PREFIXES:public/plugins/}
    internal-url: ${MARKETPLACE_ZOT_URL:http://localhost:5000}
    promotion-username: ${MARKETPLACE_ZOT_PROMOTION_USERNAME:promoter}
    promotion-password: ${MARKETPLACE_ZOT_PROMOTION_PASSWORD:}
    binary: ${MARKETPLACE_ZOT_BINARY:}
    config: ${MARKETPLACE_ZOT_CONFIG:/etc/zot/config.json}
  publisher:
    token-sha256: ${MARKETPLACE_PUBLISHER_TOKEN_SHA256:}
  admin:
    token-sha256: ${MARKETPLACE_ADMIN_TOKEN_SHA256:}
  revocation:
    token-sha256: ${MARKETPLACE_REVOCATION_TOKEN_SHA256:}
  signing:
    ingest-token-sha256: ${MARKETPLACE_SIGNING_INGEST_TOKEN_SHA256:}
    trusted-keys: ${MARKETPLACE_SIGNING_TRUSTED_KEYS:}
  advisory:
    signing:
      key-id: ${MARKETPLACE_ADVISORY_SIGNING_KEY_ID:}
      private-key-base64: ${MARKETPLACE_ADVISORY_SIGNING_PRIVATE_KEY_BASE64:}
    feed-ttl: ${MARKETPLACE_ADVISORY_FEED_TTL:PT24H}
    feed-refresh-cron: ${MARKETPLACE_ADVISORY_FEED_REFRESH_CRON:0 0 */6 * * *}
  media:
    root: ${MARKETPLACE_MEDIA_ROOT:./data/assets}
