name: Marketplace CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      MARKETPLACE_COMPOSE_PROJECT: marketplace-acceptance-${{ github.run_id }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Checkout the pinned Artio Core runtime for compatibility acceptance
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: dvoracek-martin/artio
          ref: 80b8f799e1ab3329844e0fa564f0f373b1ad4c07
          path: artio-core
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Compile, format, unit and architecture checks, coverage
        run: ./gradlew --no-daemon spotlessCheck clean build jacocoTestReport :marketplace-domain:jacocoTestCoverageVerification
      - name: Lint OpenAPI 3.1 contract
        run: npx --yes @redocly/cli@1.34.5 lint marketplace-contract/openapi.yaml
      - name: Verify the single current V1 schema on disposable PostgreSQL
        run: bash ./scripts/test-current-schema.sh
      - name: Prepare isolated Docker acceptance credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 secrets
          publisher_token=$(openssl rand -hex 32)
          admin_token=$(openssl rand -hex 32)
          revocation_token=$(openssl rand -hex 32)
          signing_token=$(openssl rand -hex 32)
          signing_key_id=ci-acceptance-2026
          advisory_signing_key_id=ci-advisory-2026
          zot_password=$(openssl rand -hex 32)
          promoter_password=$(openssl rand -hex 32)
          postgres_password=$(openssl rand -hex 32)
          echo "::add-mask::$publisher_token"
          echo "::add-mask::$admin_token"
          echo "::add-mask::$revocation_token"
          echo "::add-mask::$signing_token"
          echo "::add-mask::$zot_password"
          echo "::add-mask::$promoter_password"
          echo "::add-mask::$postgres_password"
          printf '%s\n' "$publisher_token" > secrets/publisher-token.txt
          printf '%s\n' "$admin_token" > secrets/admin-token.txt
          printf '%s\n' "$revocation_token" > secrets/revocation-token.txt
          printf '%s\n' "$signing_token" > secrets/signing-ingest-token.txt
          openssl genpkey -algorithm Ed25519 -out secrets/release-signing-key.pem
          signing_public_key=$(openssl pkey -in secrets/release-signing-key.pem -pubout -outform DER | base64 -w0 | tr '+/' '-_' | tr -d '=')
          chmod 600 secrets/release-signing-key.pem
          openssl genpkey -algorithm Ed25519 -out secrets/advisory-signing-key.pem
          advisory_private_key=$(openssl pkcs8 -topk8 -nocrypt -outform DER -in secrets/advisory-signing-key.pem | base64 -w0)
          advisory_public_key=$(openssl pkey -in secrets/advisory-signing-key.pem -pubout -outform DER | base64 -w0 | tr '+/' '-_' | tr -d '=')
          chmod 600 secrets/advisory-signing-key.pem
          printf '%s\n' "$zot_password" | docker run --rm -i --entrypoint htpasswd httpd:2.4-alpine -Bbn -i publisher > secrets/zot.htpasswd
          printf '%s\n' "$promoter_password" | docker run --rm -i --entrypoint htpasswd httpd:2.4-alpine -Bbn -i promoter >> secrets/zot.htpasswd
          token_hash=$(printf '%s' "$publisher_token" | sha256sum | cut -d' ' -f1)
          admin_token_hash=$(printf '%s' "$admin_token" | sha256sum | cut -d' ' -f1)
          revocation_token_hash=$(printf '%s' "$revocation_token" | sha256sum | cut -d' ' -f1)
          signing_token_hash=$(printf '%s' "$signing_token" | sha256sum | cut -d' ' -f1)
          cat > .env <<EOF
          POSTGRES_PASSWORD=$postgres_password
          MARKETPLACE_PUBLISHER_TOKEN_SHA256=$token_hash
          MARKETPLACE_ADMIN_TOKEN_SHA256=$admin_token_hash
          MARKETPLACE_REVOCATION_TOKEN_SHA256=$revocation_token_hash
          MARKETPLACE_SIGNING_INGEST_TOKEN_SHA256=$signing_token_hash
          MARKETPLACE_SIGNING_TRUSTED_KEYS=$signing_key_id=$signing_public_key
          MARKETPLACE_ADVISORY_SIGNING_KEY_ID=$advisory_signing_key_id
          MARKETPLACE_ADVISORY_SIGNING_PRIVATE_KEY_BASE64=$advisory_private_key
          MARKETPLACE_ZOT_PROMOTION_USERNAME=promoter
          MARKETPLACE_ZOT_PROMOTION_PASSWORD=$promoter_password
          MARKETPLACE_PUBLISHER_RATE_LIMIT_PER_MINUTE=200
          MARKETPLACE_REGISTRY_HOST=localhost:5000
          MARKETPLACE_API_PORT=8080
          MARKETPLACE_REGISTRY_PORT=5000
          ZOT_HTPASSWD_FILE=$(pwd)/secrets/zot.htpasswd
          EOF
          echo "MARKETPLACE_ZOT_TEST_PASSWORD=$zot_password" >> "$GITHUB_ENV"
          echo "MARKETPLACE_ZOT_PROMOTION_TEST_PASSWORD=$promoter_password" >> "$GITHUB_ENV"
          echo "MARKETPLACE_PUBLISHER_TOKEN_FILE=$(pwd)/secrets/publisher-token.txt" >> "$GITHUB_ENV"
          echo "MARKETPLACE_SIGNING_INGEST_TOKEN_FILE=$(pwd)/secrets/signing-ingest-token.txt" >> "$GITHUB_ENV"
          echo "MARKETPLACE_SIGNING_PRIVATE_KEY_FILE=$(pwd)/secrets/release-signing-key.pem" >> "$GITHUB_ENV"
          echo "MARKETPLACE_SIGNING_KEY_ID=$signing_key_id" >> "$GITHUB_ENV"
          echo "ARTIO_MARKETPLACE_ADVISORY_TRUSTED_KEYS=$advisory_signing_key_id=$advisory_public_key" >> "$GITHUB_ENV"
      - name: Enable local HTTP registry for the Docker acceptance fixture
        run: |
          echo '{"insecure-registries":["localhost:5000","localhost:5001"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info
      - name: Register QEMU for the arm64 OCI acceptance fixture
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Start Marketplace, Zot and PostgreSQL
        id: start-stack
        run: docker compose --project-name "$MARKETPLACE_COMPOSE_PROJECT" --env-file .env -f deployment/compose.yaml up --build -d
      - name: Verify the acceptance gate fails closed
        run: bash ./scripts/test-acceptance-fail-closed.sh
      - name: Exercise live Zot ACL, OCI publication and public API
        id: acceptance
        env:
          ARTIO_CORE_PATH: ${{ github.workspace }}/artio-core
          MARKETPLACE_ADMIN_TOKEN_FILE: ${{ github.workspace }}/secrets/admin-token.txt
          MARKETPLACE_REVOCATION_TOKEN_FILE: ${{ github.workspace }}/secrets/revocation-token.txt
          MARKETPLACE_SIGNING_INGEST_TOKEN_FILE: ${{ github.workspace }}/secrets/signing-ingest-token.txt
          MARKETPLACE_SIGNING_PRIVATE_KEY_FILE: ${{ github.workspace }}/secrets/release-signing-key.pem
          MARKETPLACE_SIGNING_KEY_ID: ci-acceptance-2026
        run: bash ./scripts/run-acceptance.sh
      - name: Restore isolated PostgreSQL, Zot and media backup and smoke-pull a published digest
        if: always() && !cancelled() && steps.start-stack.outcome == 'success'
        env:
          MARKETPLACE_RESTORE_DRILL: '1'
          MARKETPLACE_ENV_FILE: .env
        run: bash ./scripts/backup-restore-drill.sh
      - name: Capture diagnostics on failure
        if: failure()
        run: |
          if [ -f .env ]; then
            docker compose --project-name "$MARKETPLACE_COMPOSE_PROJECT" --env-file .env -f deployment/compose.yaml logs --no-color
          else
            docker compose --project-name "$MARKETPLACE_COMPOSE_PROJECT" -f deployment/compose.yaml logs --no-color || true
          fi
      - name: Generate SPDX SBOM for verified image
        if: always() && !cancelled() && steps.start-stack.outcome == 'success'
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/syft:v1.28.0 artio-marketplace:local -o spdx-json=marketplace.spdx.json
      - name: Upload verified build and SBOM artifacts
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: artio-marketplace-${{ github.sha }}
          path: |
            marketplace-server/build/libs/marketplace-server-0.1.0-SNAPSHOT.jar
            marketplace.spdx.json
            marketplace-server/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: error
          retention-days: 30
      - name: Scan Marketplace image for fixed HIGH and CRITICAL vulnerabilities
        if: always() && !cancelled() && steps.start-stack.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: artio-marketplace:local
          version: v0.76.0
          format: table
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Stop ephemeral acceptance stack
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose --project-name "$MARKETPLACE_COMPOSE_PROJECT" --env-file .env -f deployment/compose.yaml down -v
          else
            docker compose --project-name "$MARKETPLACE_COMPOSE_PROJECT" -f deployment/compose.yaml down -v
          fi

